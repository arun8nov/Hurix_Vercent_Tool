<style>
/* CSS Reset and Global Variables */
:root {
  --bg-primary: #0a0d16;
  --bg-secondary: #121826;
  --bg-tertiary: #1b2336;
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-tertiary: #64748b;
  
  --accent-primary: #10b981; /* Emerald green for positive action/mic */
  --accent-hover: #059669;
  
  --color-danger: #ef4444; /* Red for corrections */
  --color-success: #10b981; /* Green for corrected text */
  --color-info: #0ea5e9; /* Blue for dashboard info */
  
  --border-color: #26334d;
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-sans);
  line-height: 1.5;
  overflow-x: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Scrollbar Styling */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: var(--bg-primary);
}
::-webkit-scrollbar-thumb {
  background: var(--bg-tertiary);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--text-tertiary);
}

/* Header & Navbar */
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  padding: 0.75rem 2rem;
  height: 64px;
  z-index: 100;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.logo-icon {
  font-size: 1.5rem;
}

.logo-text {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -0.025em;
  color: var(--text-primary);
}

.logo-accent {
  color: var(--accent-primary);
}

.nav-links {
  display: flex;
  gap: 0.5rem;
}

.nav-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 0.875rem;
  font-weight: 600;
  padding: 0.5rem 1rem;
  cursor: pointer;
  border-radius: 0.375rem;
  transition: all 0.2s ease;
}

.nav-btn:hover {
  color: var(--text-primary);
  background-color: var(--bg-tertiary);
}

.nav-btn.active {
  color: var(--text-primary);
  background-color: var(--bg-tertiary);
  border-bottom: 2px solid var(--accent-primary);
  border-radius: 0.375rem 0.375rem 0 0;
}

.user-profile {
  display: flex;
  align-items: center;
}

.user-badge {
  background-color: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  padding: 0.375rem 0.75rem;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 500;
}

/* App Views Layout */
.app-container {
  flex: 1;
  overflow: hidden;
  position: relative;
  height: calc(100vh - 64px);
}

.app-view {
  display: none;
  height: 100%;
  padding: 1.5rem 2rem;
  overflow-y: auto;
}

.app-view.active {
  display: block;
}

/* Workspace Layout Grid */
.workspace-grid {
  display: grid;
  grid-template-columns: 280px 1fr 340px;
  gap: 1.5rem;
  height: 100%;
}

/* Base Cards & Typography */
h2 {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
  letter-spacing: -0.02em;
}

h3 {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 1rem;
  text-transform: uppercase;
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  color: var(--text-secondary);
}

h4 {
  font-size: 0.925rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
}

p {
  color: var(--text-secondary);
  font-size: 0.875rem;
}

.subtitle {
  margin-bottom: 1.5rem;
}

.mt-2 { margin-top: 0.5rem; }
.mt-4 { margin-top: 1rem; }
.mt-6 { margin-top: 1.5rem; }
.w-full { width: 100%; }
.italic { font-style: italic; }
.hidden { display: none !important; }

/* Control Panel (Left column) */
.control-panel {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  height: 100%;
  overflow-y: auto;
}

.panel-section {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 0.75rem;
  padding: 1.25rem;
}

.session-stats-card {
  margin-top: auto;
}

/* Central Voice Hub (Middle column) */
.voice-hub {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  height: 100%;
  overflow: hidden;
}

.voice-card {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 0.75rem;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
}

.visualizer-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 1rem 0;
  width: 100%;
}

.mic-btnIdle, .mic-btnListening, .mic-btnSpeaking {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  z-index: 10;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: var(--shadow-lg);
}

.mic-btnIdle {
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
}

.mic-btnIdle:hover {
  background-color: var(--border-color);
  transform: scale(1.05);
}

.mic-btnListening {
  background-color: #ef4444; /* Red pulse */
  color: #ffffff;
  animation: listening-pulse 1.5s infinite;
}

.mic-btnSpeaking {
  background-color: var(--accent-primary);
  color: #ffffff;
}

.mic-icon {
  font-size: 2.25rem;
}

.mic-halo {
  position: absolute;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: 1px solid var(--border-color);
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s ease;
}

.mic-btnListening ~ .mic-halo {
  animation: halo-ripple 1.5s infinite;
}

@keyframes listening-pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
  100% { transform: scale(1); }
}

@keyframes halo-ripple {
  0% { transform: scale(0.6); opacity: 0.8; }
  100% { transform: scale(1.2); opacity: 0; }
}

.voice-status {
  margin-top: 1rem;
  font-size: 0.875rem;
  font-weight: 500;
  text-align: center;
  color: var(--text-secondary);
}

.speech-box {
  width: 100%;
  background-color: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: 0.5rem;
  padding: 1rem;
}

.speech-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-tertiary);
  margin-bottom: 0.5rem;
  text-transform: uppercase;
}

.pulse-dot {
  width: 8px;
  height: 8px;
  background-color: #ef4444;
  border-radius: 50%;
  display: inline-block;
  animation: dot-blink 1.2s infinite;
}

@keyframes dot-blink {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 1; }
}

.speech-body {
  min-height: 48px;
  font-size: 0.935rem;
  color: var(--text-primary);
  word-break: break-word;
}

/* Dialogue Panel (History logs) */
.dialogue-panel {
  flex: 1;
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 0.75rem;
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.chat-history {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding-right: 0.5rem;
}

.system-message {
  align-self: center;
  background-color: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  font-size: 0.8rem;
  padding: 0.5rem 1rem;
  border-radius: 0.5rem;
  text-align: center;
  max-width: 80%;
}

.bubble {
  max-width: 80%;
  padding: 0.75rem 1rem;
  border-radius: 0.75rem;
  font-size: 0.875rem;
  word-break: break-word;
}

.bubble-user {
  align-self: flex-end;
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
  border-bottom-right-radius: 0.125rem;
  border: 1px solid var(--border-color);
}

.bubble-ai {
  align-self: flex-start;
  background-color: var(--bg-primary);
  color: var(--text-primary);
  border-bottom-left-radius: 0.125rem;
  border: 1px solid var(--border-color);
}

/* Feedback Panel (Right column) */
.feedback-panel {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 0.75rem;
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

.corrections-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.no-corrections {
  color: var(--text-tertiary);
  font-style: italic;
  font-size: 0.875rem;
  text-align: center;
  margin-top: 2rem;
}

.correction-card {
  background-color: var(--bg-primary);
  border-left: 4px solid var(--color-danger);
  padding: 0.875rem;
  border-radius: 0.375rem;
  font-size: 0.825rem;
  box-shadow: var(--shadow-sm);
}

.correction-header {
  font-weight: 700;
  text-transform: uppercase;
  font-size: 0.7rem;
  color: var(--color-danger);
  margin-bottom: 0.375rem;
  letter-spacing: 0.05em;
}

.correction-text-wrong {
  color: var(--text-secondary);
  text-decoration: line-through;
  margin-bottom: 0.25rem;
  word-break: break-word;
}

.correction-text-right {
  color: var(--text-primary);
  font-weight: 500;
  margin-bottom: 0.5rem;
  word-break: break-word;
}

.correction-text-right strong {
  color: var(--color-success);
}

.correction-explanation {
  color: var(--text-secondary);
  font-style: italic;
  font-size: 0.75rem;
  background-color: var(--bg-secondary);
  padding: 0.375rem 0.5rem;
  border-radius: 0.25rem;
  border: 1px solid var(--border-color);
}

/* Forms and Inputs */
.form-group {
  margin-bottom: 1.25rem;
}

label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-secondary);
  margin-bottom: 0.375rem;
}

select, input[type="text"], input[type="password"], textarea {
  width: 100%;
  background-color: var(--bg-primary);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 0.875rem;
  padding: 0.625rem 0.875rem;
  border-radius: 0.5rem;
  outline: none;
  transition: border-color 0.2s ease;
}

select:focus, input:focus, textarea:focus {
  border-color: var(--accent-primary);
}

.slider-container {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

input[type="range"] {
  flex: 1;
  accent-color: var(--accent-primary);
  height: 6px;
  border-radius: 3px;
  outline: none;
}

#val-temp {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  width: 24px;
  text-align: right;
}

/* Settings Checkbox */
.checkbox-container {
  display: flex;
  align-items: center;
  position: relative;
  padding-left: 2rem;
  cursor: pointer;
  font-size: 0.825rem;
  color: var(--text-secondary);
  user-select: none;
  text-transform: none;
  letter-spacing: normal;
  font-weight: normal;
  margin-top: 1rem;
}

.checkbox-container input {
  position: absolute;
  opacity: 0;
  cursor: pointer;
  height: 0;
  width: 0;
}

.checkmark {
  position: absolute;
  top: 0;
  left: 0;
  height: 20px;
  width: 20px;
  background-color: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: 4px;
}

.checkbox-container:hover input ~ .checkmark {
  border-color: var(--text-tertiary);
}

.checkbox-container input:checked ~ .checkmark {
  background-color: var(--accent-primary);
  border-color: var(--accent-primary);
}

.checkmark:after {
  content: "";
  position: absolute;
  display: none;
}

.checkbox-container input:checked ~ .checkmark:after {
  display: block;
}

.checkbox-container .checkmark:after {
  left: 6px;
  top: 2px;
  width: 5px;
  height: 10px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

.input-note {
  font-size: 0.725rem;
  color: var(--text-tertiary);
  margin-top: 0.25rem;
}

.input-note a {
  color: var(--accent-primary);
  text-decoration: none;
}

.input-note a:hover {
  text-decoration: underline;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-sans);
  font-size: 0.875rem;
  font-weight: 600;
  padding: 0.625rem 1.25rem;
  border-radius: 0.5rem;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
  gap: 0.5rem;
}

.btn-primary {
  background-color: var(--accent-primary);
  color: #ffffff;
}

.btn-primary:hover {
  background-color: var(--accent-hover);
}

.btn-secondary {
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border-color);
}

.btn-secondary:hover {
  background-color: var(--border-color);
}

.btn-outline {
  background-color: transparent;
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
}

.btn-outline:hover {
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
}

/* Statistics Grid and Boxes */
.stats-row {
  display: flex;
  gap: 0.75rem;
}

.stat-box {
  flex: 1;
  background-color: var(--bg-primary);
  border: 1px solid var(--border-color);
  padding: 0.75rem;
  border-radius: 0.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.stat-label {
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-tertiary);
  letter-spacing: 0.05em;
}

.stat-val {
  font-size: 1.125rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-top: 0.25rem;
}

/* Settings Page layout */
.settings-card {
  max-width: 600px;
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 0.75rem;
  padding: 1.5rem;
  margin: 0 auto;
}

.settings-actions {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.status-msg {
  font-size: 0.8rem;
  color: var(--accent-primary);
}

/* Analytics page styling */
.analytics-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
}

.analytics-actions {
  display: flex;
  gap: 0.5rem;
}

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.25rem;
  margin-bottom: 2rem;
}

.metric-card {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 0.75rem;
  padding: 1.25rem;
  display: flex;
  align-items: flex-start;
  gap: 1rem;
}

.metric-icon {
  font-size: 1.75rem;
  background-color: var(--bg-tertiary);
  width: 48px;
  height: 48px;
  border-radius: 0.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-color);
}

.metric-content h3 {
  font-size: 0.65rem;
  margin-bottom: 0.125rem;
}

.metric-value {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text-primary);
  display: block;
}

.metric-content p {
  font-size: 0.7rem;
  color: var(--text-tertiary);
  margin-top: 0.125rem;
}

/* Data Tables */
.table-container {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 0.75rem;
  padding: 1.25rem;
  overflow: hidden;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

.data-table th, .data-table td {
  padding: 0.75rem 1rem;
  font-size: 0.825rem;
}

.data-table th {
  background-color: var(--bg-primary);
  color: var(--text-secondary);
  font-weight: 600;
  text-transform: uppercase;
  font-size: 0.65rem;
  letter-spacing: 0.05em;
  border-bottom: 1px solid var(--border-color);
}

.data-table td {
  border-bottom: 1px solid var(--border-color);
  color: var(--text-primary);
}

.data-table tr:last-child td {
  border-bottom: none;
}

.data-table tr:hover td {
  background-color: var(--bg-tertiary);
}

.text-center {
  text-align: center;
}

/* Toast Floating Notifications */
.toast {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-left: 4px solid var(--accent-primary);
  color: var(--text-primary);
  padding: 1rem 1.5rem;
  border-radius: 0.5rem;
  font-size: 0.875rem;
  box-shadow: var(--shadow-lg);
  z-index: 1000;
  transition: opacity 0.3s ease, transform 0.3s ease;
  transform: translateY(0);
  opacity: 1;
}

.toast.hidden {
  opacity: 0;
  transform: translateY(20px);
  pointer-events: none;
}

.text-fallback-container {
  margin-top: 0.75rem;
  width: 100%;
}

.text-fallback-container input {
  width: 100%;
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 0.825rem;
  padding: 0.5rem 0.75rem;
  border-radius: 0.375rem;
  outline: none;
  transition: all 0.2s ease;
}

.text-fallback-container input:focus {
  border-color: var(--accent-primary);
  background-color: var(--bg-tertiary);
}

.text-fallback-container input:disabled {
  background-color: var(--bg-primary);
  color: var(--text-tertiary);
  cursor: not-allowed;
  border-color: var(--border-color);
}

/* Responsiveness tweaks */
@media (max-width: 1024px) {
  .workspace-grid {
    grid-template-columns: 240px 1fr;
    grid-template-rows: auto auto;
  }
  
  .feedback-panel {
    grid-column: span 2;
    height: 350px;
  }
}

@media (max-width: 768px) {
  .workspace-grid {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
  }
  
  .control-panel {
    grid-column: span 1;
  }
  
  .voice-hub {
    grid-column: span 1;
  }
  
  .feedback-panel {
    grid-column: span 1;
    height: 350px;
  }
  
  .navbar {
    flex-direction: column;
    height: auto;
    gap: 0.75rem;
    padding: 1rem;
  }
  
  .app-container {
    height: auto;
    overflow-y: auto;
  }
}
</style>
