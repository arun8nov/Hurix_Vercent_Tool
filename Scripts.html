<script>
// State variables
let recognition = null;
let isListening = false;
let isSpeaking = false;
let sessionActive = false;
let currentTranscript = "";
let lastError = null;

let sessionId = "";
let chatHistory = [];
let turnsList = []; // Detailed logs for Google Sheets
let turnCounter = 0;
const maxTurns = 10;

let sessionStartTime = null;
let totalWordsSpoken = 0;
let grammarScores = [];
let vocabScores = [];

// System Prompts for Gemini for each scenario
const SYSTEM_PROMPTS = {
  casual: `You are a supportive and encouraging English conversation partner. Speak naturally and roleplay a friendly acquaintance chatting over coffee. Keep your responses short (1-3 sentences) and conversational. Analyze the user's spoken sentence for grammar, spelling, or vocabulary mistakes. Return your reply in the requested JSON schema.`,
  
  interview: `You are a professional HR Manager conducting a job interview. Roleplay the interviewer. Ask typical behavioral or technical questions based on the candidate's previous response. Keep your spoken responses under 2-3 sentences. Grade their English response strictly. Return your reply in the requested JSON schema.`,
  
  support: `You are an frustrated customer calling customer support. Roleplay this customer. Speak with realistic emotion but keep it polite and under 2-3 sentences. Let the user act as the support representative trying to solve your issue. Grade their empathy and language. Return your reply in the requested JSON schema.`,
  
  presentation: `You are an audience member listening to a business presentation. Ask critical but helpful questions about their project or product. Keep your questions under 2-3 sentences. Evaluate their English presentation skills. Return your reply in the requested JSON schema.`,
  
  custom: `You are a patient English conversation coach. Please follow this custom scenario: `
};

// Initialize on page load
window.addEventListener('DOMContentLoaded', () => {
  // Load settings from LocalStorage
  const savedKey = localStorage.getItem("vercent_user_api_key");
  if (savedKey) {
    document.getElementById("input-api-key").value = savedKey;
  }
  
  const useSim = localStorage.getItem("vercent_use_simulation") === "true";
  document.getElementById("chk-simulation").checked = useSim;
  toggleSimulationCheckbox();

  // Initialize Speech Recognition
  initSpeechRecognition();
  
  // Pre-load voices
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
  }

  // Load analytics reports
  loadReportsData();
});

/* View Swapping */
function switchView(viewName) {
  document.querySelectorAll('.app-view').forEach(view => view.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  
  document.getElementById(`view-${viewName}`).classList.add('active');
  document.getElementById(`btn-${viewName}-view`).classList.add('active');
  
  if (viewName === 'analytics') {
    loadReportsData();
  }
}

/* Save settings local storage */
function saveSettings() {
  const key = document.getElementById("input-api-key").value.trim();
  const sim = document.getElementById("chk-simulation").checked;
  
  localStorage.setItem("vercent_user_api_key", key);
  localStorage.setItem("vercent_use_simulation", sim);
  
  showToast("Settings saved successfully.");
  
  const status = document.getElementById("settings-status");
  status.innerText = "Settings Saved!";
  setTimeout(() => { status.innerText = ""; }, 3000);
}

function toggleSimulationCheckbox() {
  const isSim = document.getElementById("chk-simulation").checked;
  const keyInput = document.getElementById("input-api-key");
  if (isSim) {
    keyInput.disabled = true;
    keyInput.placeholder = "Simulation Mode Active - Key Not Required";
  } else {
    keyInput.disabled = false;
    keyInput.placeholder = "AIzaSy...";
  }
}

/* Database Initialization */
function initializeDatabase() {
  showToast("Initializing spreadsheet tabs...");
  google.script.run
    .withSuccessHandler(msg => {
      showToast(msg);
    })
    .withFailureHandler(err => {
      showToast("DB Init Failed: " + err.message);
    })
    .initDatabase();
}

/* Web Speech Recognition Initialization (STT) */
function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById("voice-status-text").innerText = "Speech Recognition API is not supported in this browser. Please use Google Chrome.";
    document.getElementById("btn-mic").disabled = true;
    return;
  }

  recognition = new SpeechRecognition();
  recognition.continuous = false; // Turn-by-turn processing
  recognition.interimResults = true; // Show text as user speaks
  
  // Set language to selected accent
  try {
    recognition.lang = document.getElementById("select-accent").value || "en-US";
  } catch (e) {
    console.error("Error setting recognition language:", e);
  }
  
  recognition.onstart = () => {
    isListening = true;
    lastError = null; // Reset error state
    currentTranscript = ""; // Reset transcript
    const mic = document.getElementById("btn-mic");
    mic.className = "mic-btnListening";
    document.getElementById("voice-status-text").innerText = "Listening... Speak clearly now.";
    document.getElementById("speech-indicator").classList.remove("hidden");
    document.getElementById("user-live-transcript").innerText = "Listening...";
  };

  recognition.onresult = (event) => {
    let interimTranscript = '';
    let finalTranscript = '';

    for (let i = event.resultIndex; i < event.results.length; ++i) {
      if (event.results[i].isFinal) {
        finalTranscript += event.results[i][0].transcript;
      } else {
        interimTranscript += event.results[i][0].transcript;
      }
    }

    currentTranscript = finalTranscript || interimTranscript;
    document.getElementById("user-live-transcript").innerText = currentTranscript || "Listening...";
  };

  recognition.onerror = (event) => {
    console.error("Speech Recognition Error:", event.error);
    lastError = event.error; // Save the error
    const statusText = document.getElementById("voice-status-text");
    if (event.error === 'no-speech') {
      statusText.innerText = "No speech detected. Click mic to speak again.";
    } else if (event.error === 'not-allowed') {
      statusText.innerHTML = "<span style='color:#ef4444; font-weight:bold;'>Mic Permission Blocked!</span><br>Open the Web App URL directly in a new browser tab to allow mic.";
      showToast("⚠️ Microphone access was blocked. Open the web app URL directly in a new tab.");
    } else {
      statusText.innerText = "Error: " + event.error;
    }
    stopListeningState();
  };

  recognition.onend = () => {
    isListening = false;
    document.getElementById("speech-indicator").classList.add("hidden");
    
    if (!sessionActive) {
      stopListeningState();
      return;
    }

    // If an error occurred, do not overwrite the error status message
    if (lastError) {
      stopListeningState();
      return;
    }

    const transcript = currentTranscript.trim();
    if (transcript && transcript !== "") {
      // Process speech turn
      sendTextToAI(transcript);
    } else {
      // Re-prompt user if no speech recorded
      document.getElementById("voice-status-text").innerText = "Microphone closed. Click mic to resume speaking.";
      stopListeningState();
    }
  };
}

function stopListeningState() {
  isListening = false;
  const mic = document.getElementById("btn-mic");
  mic.className = "mic-btnIdle";
}

/* Web Speech Synthesis (TTS) */
function speakResponse(text, callback) {
  if (!window.speechSynthesis) {
    if (callback) callback();
    return;
  }

  // Cancel any ongoing speaking
  window.speechSynthesis.cancel();
  
  isSpeaking = true;
  const mic = document.getElementById("btn-mic");
  mic.className = "mic-btnSpeaking";
  document.getElementById("voice-status-text").innerText = "Coach is speaking...";

  const utterance = new SpeechSynthesisUtterance(text);
  const accent = document.getElementById("select-accent").value;
  
  // Select matching accent voice if available
  const voices = window.speechSynthesis.getVoices();
  const selectedVoice = voices.find(v => v.lang.startsWith(accent)) || voices.find(v => v.lang.startsWith("en"));
  
  if (selectedVoice) {
    utterance.voice = selectedVoice;
  }
  
  utterance.rate = 0.95; // Slightly slower for language learners
  utterance.pitch = 1.0;

  let callbackCalled = false;
  const safeCallback = () => {
    if (!callbackCalled) {
      callbackCalled = true;
      if (callback) callback();
    }
  };

  utterance.onend = () => {
    isSpeaking = false;
    mic.className = "mic-btnIdle";
    document.getElementById("voice-status-text").innerText = "Listening... Speak now.";
    safeCallback();
  };

  utterance.onerror = (e) => {
    console.error("Speech Synthesis Error:", e);
    isSpeaking = false;
    mic.className = "mic-btnIdle";
    safeCallback();
  };

  window.speechSynthesis.speak(utterance);
  
  // Safety timeout: 1.5 seconds per word + 3 seconds padding
  const wordCount = text.split(/\s+/).length;
  const timeoutMs = (wordCount * 1000) + 3000;
  setTimeout(() => {
    if (!callbackCalled && sessionActive) {
      console.warn("Speech synthesis onend didn't fire in time. Triggering safety callback.");
      isSpeaking = false;
      mic.className = "mic-btnIdle";
      safeCallback();
    }
  }, timeoutMs);
}

/* Toggle Session button handler */
function toggleVoiceSession() {
  if (!sessionActive) {
    startVoiceSession();
  } else {
    if (isListening) {
      recognition.stop();
    } else {
      stopVoiceSession();
    }
  }
}

/* Start New Voice Coach Session */
function startVoiceSession() {
  const isSim = document.getElementById("chk-simulation").checked;
  const apiKey = localStorage.getItem("vercent_user_api_key");
  
  if (!isSim && (!apiKey || apiKey.trim() === "")) {
    showToast("⚠️ Please enter a Gemini API Key in the Settings tab first!");
    switchView("settings");
    return;
  }

  sessionActive = true;
  sessionId = "sess_" + Date.now();
  chatHistory = [];
  turnsList = [];
  turnCounter = 0;
  totalWordsSpoken = 0;
  grammarScores = [];
  vocabScores = [];
  sessionStartTime = new Date();
  
  // UI setups
  document.getElementById("chat-history").innerHTML = "";
  document.getElementById("corrections-container").innerHTML = `<div class="no-corrections">Listening for your speech turns...</div>`;
  document.getElementById("end-session-card").classList.add("hidden");
  document.getElementById("stat-turns").innerText = `0 / ${maxTurns}`;
  document.getElementById("stat-wpm").innerText = "0 WPM";
  document.getElementById("stat-grammar-avg").innerText = "-%";
  document.getElementById("input-text-fallback").disabled = false;
  document.getElementById("input-text-fallback").placeholder = "Type here and press Enter to send...";
  updateDurationText();

  // Load scenarios
  const scenario = document.getElementById("select-scenario").value;
  let welcomeMessage = "Hello! I am your English coach today. Let's start chatting. What would you like to discuss?";
  if (scenario === "interview") {
    welcomeMessage = "Welcome to your interview simulation today. Thank you for coming in. To begin, could you please tell me about yourself and your background?";
  } else if (scenario === "support") {
    welcomeMessage = "Hello! I'm calling because my internet connection has been completely down all morning. I really need this fixed for work. Can you help me?";
  } else if (scenario === "presentation") {
    welcomeMessage = "Thank you for the presentation outline. I have a few questions. Could you explain what the main target audience is for this project?";
  }

  // Log initial AI turn
  appendBubble("ai", welcomeMessage);
  chatHistory.push({ role: "assistant", text: welcomeMessage });
  
  // Speak greeting and trigger listening loop
  speakResponse(welcomeMessage, () => {
    if (sessionActive) {
      recognition.start();
    }
  });
}

/* Stop Session */
function stopVoiceSession() {
  sessionActive = false;
  if (recognition) {
    recognition.stop();
  }
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
  }
  stopListeningState();
  
  document.getElementById("voice-status-text").innerText = "Voice Session Finished.";
  document.getElementById("end-session-card").classList.remove("hidden");
  
  document.getElementById("input-text-fallback").disabled = true;
  document.getElementById("input-text-fallback").placeholder = "Start session to type...";
  document.getElementById("input-text-fallback").value = "";
}

function resetVoiceSession() {
  document.getElementById("end-session-card").classList.add("hidden");
  startVoiceSession();
}

function handleTextFallbackKey(event) {
  if (event.key === "Enter") {
    const input = document.getElementById("input-text-fallback");
    const val = input.value.trim();
    if (val && val !== "") {
      input.value = "";
      
      // Stop listening if it's currently active
      if (isListening && recognition) {
        recognition.stop();
      }
      
      // Send text
      sendTextToAI(val);
    }
  }
}

/* Send user text to AI and receive response */
function sendTextToAI(userText) {
  // 1. Add user speech bubble
  appendBubble("user", userText);
  
  // 2. Count words
  const words = userText.split(/\s+/).filter(w => w.length > 0).length;
  totalWordsSpoken += words;
  
  // 3. Increment turns
  turnCounter++;
  document.getElementById("stat-turns").innerText = `${turnCounter} / ${maxTurns}`;
  
  // 4. Update speed statistics
  const elapsedSecs = Math.max(1, Math.round((new Date() - sessionStartTime) / 1000));
  const wpm = Math.round((totalWordsSpoken / elapsedSecs) * 60);
  document.getElementById("stat-wpm").innerText = `${wpm} WPM`;

  document.getElementById("voice-status-text").innerText = "Coach is thinking...";

  const scenario = document.getElementById("select-scenario").value;
  let systemPrompt = SYSTEM_PROMPTS[scenario];
  if (scenario === "custom") {
    systemPrompt += document.getElementById("input-custom-prompt").value;
  }

  const isSim = document.getElementById("chk-simulation").checked;
  
  if (isSim) {
    // Run simulation response
    setTimeout(() => {
      const mockRes = getSimulatedCoachResponse(userText, scenario);
      handleAIResult(userText, mockRes);
    }, 1000);
  } else {
    // Call server Gemini API
    const apiKey = localStorage.getItem("vercent_user_api_key");
    google.script.run
      .withSuccessHandler(responseString => {
        try {
          const responseJson = JSON.parse(responseString);
          handleAIResult(userText, responseJson);
        } catch (e) {
          console.error("Failed parsing Gemini JSON output:", e);
          const textRes = {
            reply: "I received your message, but I encountered a parsing error on my end. Could you please repeat that?",
            corrections: [],
            grammarScore: 100,
            vocabularyScore: 100
          };
          handleAIResult(userText, textRes);
        }
      })
      .withFailureHandler(err => {
        console.error("Gemini API Error:", err);
        showToast("Error: " + err.message);
        appendBubble("ai", "Sorry, I had trouble connecting to the Gemini server. Please check your API key and try again.");
        stopListeningState();
      })
      .fetchGeminiResponse(chatHistory, userText, apiKey, systemPrompt);
  }
}

/* Process Response and updates UI */
function handleAIResult(userPrompt, aiJson) {
  // 1. Render AI chat bubble
  appendBubble("ai", aiJson.reply);
  
  // 2. Add turn scores
  grammarScores.push(aiJson.grammarScore);
  vocabScores.push(aiJson.vocabularyScore);
  
  // 3. Render average grammar
  const avgGrammar = Math.round(grammarScores.reduce((a, b) => a + b, 0) / grammarScores.length);
  document.getElementById("stat-grammar-avg").innerText = `${avgGrammar}%`;

  // 4. Render corrections
  renderCorrections(aiJson.corrections);

  // 5. Append to history for API context
  chatHistory.push({ role: "user", text: userPrompt });
  chatHistory.push({ role: "assistant", text: aiJson.reply });
  
  // 6. Push to raw logs
  turnsList.push({
    userSpoke: userPrompt,
    aiSpoke: aiJson.reply,
    grammarScore: aiJson.grammarScore,
    vocabScore: aiJson.vocabularyScore,
    corrections: aiJson.corrections
  });

  // 7. Check if session limit reached
  if (turnCounter >= maxTurns) {
    speakResponse(aiJson.reply + " That concludes our practice session. Well done!", () => {
      stopVoiceSession();
    });
  } else {
    // Speak response and listen again
    speakResponse(aiJson.reply, () => {
      if (sessionActive && !isListening) {
        recognition.start();
      }
    });
  }
}

/* UI Dialogue bubbles */
function appendBubble(role, text) {
  const container = document.getElementById("chat-history");
  const bubble = document.createElement("div");
  bubble.className = `bubble bubble-${role}`;
  bubble.innerText = text;
  container.appendChild(bubble);
  container.scrollTop = container.scrollHeight;
}

/* Render corrections in the right sidebar */
function renderCorrections(corrections) {
  const container = document.getElementById("corrections-container");
  
  // Clear "Listening for speech..." on first correction
  if (turnsList.length === 1) {
    container.innerHTML = "";
  }
  
  if (!corrections || corrections.length === 0) {
    return;
  }

  corrections.forEach(item => {
    const card = document.createElement("div");
    card.className = "correction-card";
    
    // Highlight corrected parts
    const highlightedText = item.corrected.replace(
      new RegExp(`(${item.corrected.split(/\s+/).filter(w => !item.original.includes(w)).join('|')})`, 'gi'), 
      '<strong>$1</strong>'
    );

    card.innerHTML = `
      <div class="correction-header">Grammar Tip</div>
      <div class="correction-text-wrong">“${item.original}”</div>
      <div class="correction-text-right">💡 Try: “${highlightedText}”</div>
      <div class="correction-explanation">${item.explanation}</div>
    `;
    container.appendChild(card);
    container.scrollTop = container.scrollHeight;
  });
}

/* Submit evaluation reports to Google Sheets */
function submitSessionScores() {
  if (turnsList.length === 0) {
    showToast("No data to save.");
    return;
  }

  showToast("Saving report to Google Sheet...");
  
  const elapsedSecs = Math.max(1, Math.round((new Date() - sessionStartTime) / 1000));
  const avgGrammar = Math.round(grammarScores.reduce((a, b) => a + b, 0) / grammarScores.length);
  const avgVocab = Math.round(vocabScores.reduce((a, b) => a + b, 0) / vocabScores.length);
  const finalWpm = Math.round((totalWordsSpoken / elapsedSecs) * 60);

  const sessionPayload = {
    sessionId: sessionId,
    scenario: document.getElementById("select-scenario").value,
    totalTurns: turnCounter,
    avgGrammar: avgGrammar,
    avgVocab: avgVocab,
    wpm: finalWpm,
    duration: elapsedSecs,
    turns: turnsList
  };

  google.script.run
    .withSuccessHandler(res => {
      if (res.success) {
        showToast("✅ " + res.message);
        document.getElementById("end-session-card").classList.add("hidden");
        loadReportsData();
      } else {
        showToast("⚠️ " + res.message);
      }
    })
    .withFailureHandler(err => {
      showToast("Failed to save session: " + err.message);
    })
    .saveSession(sessionPayload);
}

/* Load reports from sheet and update dashboards */
function loadReportsData() {
  google.script.run
    .withSuccessHandler(reportsList => {
      updateAnalyticsDashboard(reportsList);
    })
    .withFailureHandler(err => {
      console.error("Failed loading sheet reports:", err);
    })
    .getReportsSummary();
}

function updateAnalyticsDashboard(reports) {
  const tbody = document.getElementById("table-reports-body");
  if (!reports || reports.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" class="text-center">No practice reports logged yet.</td></tr>`;
    document.getElementById("metric-grammar").innerText = "-%";
    document.getElementById("metric-vocab").innerText = "-%";
    document.getElementById("metric-wpm").innerText = "0 WPM";
    document.getElementById("metric-sessions").innerText = "0";
    return;
  }

  // Calculate overall metrics
  let totalGrammar = 0;
  let totalVocab = 0;
  let totalWpm = 0;
  
  reports.forEach(r => {
    totalGrammar += r.grammar;
    totalVocab += r.vocab;
    totalWpm += r.wpm;
  });

  const count = reports.length;
  document.getElementById("metric-grammar").innerText = Math.round(totalGrammar / count) + "%";
  document.getElementById("metric-vocab").innerText = Math.round(totalVocab / count) + "%";
  document.getElementById("metric-wpm").innerText = Math.round(totalWpm / count) + " WPM";
  document.getElementById("metric-sessions").innerText = count;

  // Build table rows
  let html = "";
  reports.forEach(r => {
    html += `
      <tr>
        <td>${r.timestamp}</td>
        <td>${r.email}</td>
        <td class="text-capitalize">${r.scenario}</td>
        <td>${r.turns}</td>
        <td><strong>${r.grammar}%</strong></td>
        <td><strong>${r.vocab}%</strong></td>
        <td>${r.wpm}</td>
        <td>${r.duration}s</td>
      </tr>
    `;
  });
  tbody.innerHTML = html;
}

/* Export to CSV download */
function exportReportsCSV() {
  const table = document.querySelector(".data-table");
  let csv = [];
  
  // Headers
  const headers = Array.from(table.querySelectorAll("th")).map(th => th.innerText);
  csv.push(headers.join(","));
  
  // Rows
  const rows = table.querySelectorAll("tbody tr");
  rows.forEach(tr => {
    const cells = Array.from(tr.querySelectorAll("td")).map(td => `"${td.innerText.replace(/"/g, '""')}"`);
    if (cells.length > 1) {
      csv.push(cells.join(","));
    }
  });

  if (csv.length <= 1) {
    showToast("No data to export.");
    return;
  }

  const csvString = csv.join("\n");
  const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.setAttribute("download", `Vercent_English_Report_${Date.now()}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast("CSV file downloaded.");
}

/* Floating Alerts (Toasts) */
function showToast(message) {
  const toast = document.getElementById("toast");
  toast.innerText = message;
  toast.classList.remove("hidden");
  
  setTimeout(() => {
    toast.classList.add("hidden");
  }, 4000);
}

/* Update Scenarios Form toggles */
function updateScenarioPrompt() {
  const val = document.getElementById("select-scenario").value;
  const customDiv = document.getElementById("custom-prompt-container");
  if (val === "custom") {
    customDiv.classList.remove("hidden");
  } else {
    customDiv.classList.add("hidden");
  }
}

function updateVoiceAccent() {
  if (sessionActive && isListening) {
    // restart listener to bind new language accent
    recognition.stop();
  }
}

// Slider visual updates
document.getElementById("slider-temp").addEventListener("input", (e) => {
  document.getElementById("val-temp").innerText = e.target.value;
});

// Running Timer Loop
setInterval(() => {
  if (sessionActive && sessionStartTime) {
    updateDurationText();
  }
}, 1000);

function updateDurationText() {
  if (sessionStartTime) {
    const elapsedSecs = Math.round((new Date() - sessionStartTime) / 1000);
    document.getElementById("stat-duration").innerText = `${elapsedSecs}s`;
  } else {
    document.getElementById("stat-duration").innerText = "0s";
  }
}

/* OFFLINE SIMULATION COACH ENGINE (Fallback when API key missing) */
function getSimulatedCoachResponse(userText, scenario) {
  const lower = userText.toLowerCase();
  
  // Clean corrections object templates
  let response = {
    reply: "That is interesting! Tell me more about that.",
    corrections: [],
    grammarScore: 100,
    vocabularyScore: 100
  };

  // 1. Check for basic grammar mistakes to simulate tutoring
  if (lower.includes("i is") || lower.includes("i am work") || lower.includes("he do not") || lower.includes("we was")) {
    response.grammarScore = 70;
    response.vocabularyScore = 80;
    
    if (lower.includes("i is")) {
      response.corrections.push({
        original: "I is",
        corrected: "I am",
        explanation: "Always use 'am' with the first person pronoun 'I'."
      });
      response.reply = "I understand what you mean. Remember that we say 'I am'. What are you working on right now?";
    } else if (lower.includes("i am work")) {
      response.corrections.push({
        original: "I am work",
        corrected: "I am working",
        explanation: "Use present continuous tense 'am working' to describe actions happening now."
      });
      response.reply = "Got it! So you are working on it. What tasks does your work involve?";
    } else if (lower.includes("he do not")) {
      response.corrections.push({
        original: "he do not",
        corrected: "he does not",
        explanation: "Use 'does' for third-person singular pronouns (he, she, it)."
      });
      response.reply = "Ah, so he doesn't do it. How do you handle that situation?";
    } else if (lower.includes("we was")) {
      response.corrections.push({
        original: "we was",
        corrected: "we were",
        explanation: "Use 'were' for plural pronouns like 'we' and 'they'."
      });
      response.reply = "We were doing that too. Who else is in your team working on this?";
    }
    return response;
